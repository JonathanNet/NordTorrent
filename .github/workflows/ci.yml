name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config

      - name: Run tests
        run: cargo test --locked --manifest-path server/Cargo.toml
